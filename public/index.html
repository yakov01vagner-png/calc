<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#15161a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Калькулятор">
  <title>Калькулятор</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #15161a; color: #f3f4f6;
      overscroll-behavior: none; user-select: none; -webkit-user-select: none;
    }
    .app {
      width: 100%; max-width: 480px; height: 100%;
      display: flex; flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 12px) calc(env(safe-area-inset-right) + 12px)
               calc(env(safe-area-inset-bottom) + 12px) calc(env(safe-area-inset-left) + 12px);
    }
    .status { font-size: 13px; color: #9ca3af; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; }
    .status.offline .dot { background: #f59e0b; }
    .display {
      flex: 1; min-height: 140px;
      display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-end;
      padding: 8px 4px 16px; overflow: hidden;
    }
    .expr { color: #9ca3af; font-size: 24px; min-height: 32px; word-break: break-all; text-align: right; }
    .result { font-size: 56px; font-weight: 300; line-height: 1.1; word-break: break-all; text-align: right; }
    .result.error { color: #f87171; font-size: 24px; font-weight: 400; }
    .keys {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      height: min(62vh, 560px);
    }
    button {
      border: 0; border-radius: 22px; font: inherit; font-size: 28px;
      background: #2b2d34; color: #f3f4f6; touch-action: manipulation; cursor: pointer;
      transition: filter .08s, transform .08s;
    }
    button:active { filter: brightness(1.35); transform: scale(.96); }
    button.fn { background: #4b5563; font-size: 24px; }
    button.op { background: #374151; color: #fbbf24; }
    button.clear { background: #b91c1c; }
    button.eq { background: #f59e0b; color: #111; grid-row: span 2; font-size: 36px; }
    button.zero { grid-column: span 2; }
  </style>
</head>
<body>
  <main class="app">
    <div class="status" id="status"><span class="dot"></span><span id="status-text">Сервер подключён</span></div>
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="clear" data-action="clear">C</button>
      <button class="fn" data-action="back" aria-label="Стереть">⌫</button>
      <button class="op" data-key="%">%</button>
      <button class="op" data-key="/">÷</button>

      <button class="fn" data-key="(">(</button>
      <button class="fn" data-key=")">)</button>
      <button class="op" data-key="^">xʸ</button>
      <button class="op" data-key="*">×</button>

      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="op" data-key="-">−</button>

      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button class="op" data-key="+">+</button>

      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button class="eq" data-action="eq">=</button>

      <button class="zero" data-key="0">0</button>
      <button data-key=".">,</button>
    </div>
  </main>
  <script src="/calculator.js"></script>
  <script>
    const exprEl = document.getElementById('expr');
    const resultEl = document.getElementById('result');
    const statusEl = document.getElementById('status');
    const statusText = document.getElementById('status-text');
    const SHOW = { '*': '×', '/': '÷', '-': '−', '.': ',' };
    let expr = '';

    const pretty = (text) => text.replace(/[*\/\-.]/g, (c) => SHOW[c]);

    function render() {
      exprEl.textContent = pretty(expr);
    }

    function setOnline(online) {
      statusEl.classList.toggle('offline', !online);
      statusText.textContent = online ? 'Сервер подключён' : 'Нет связи с сервером — считаю на телефоне';
    }

    function showResult(value) {
      resultEl.className = 'result';
      resultEl.textContent = String(value).replace('.', ',');
      expr = String(value);
    }

    function showError(message) {
      resultEl.className = 'result error';
      resultEl.textContent = message;
    }

    async function calculate() {
      if (!expr) return;
      const entered = expr;
      try {
        // Основной путь: вычисление через роут сервера GET /calc?expr=...
        const res = await fetch('/calc?expr=' + encodeURIComponent(expr), { cache: 'no-store' });
        const data = await res.json();
        setOnline(true);
        if (res.ok) showResult(data.result); else showError(data.error);
      } catch {
        // Сервер недоступен — тот же калькулятор выполняется прямо на телефоне.
        setOnline(false);
        try { showResult(Calculator.evaluate(expr)); } catch (err) { showError(err.message); }
      }
      // Сверху — введённое выражение, снизу — ответ.
      exprEl.textContent = pretty(entered) + ' =';
    }

    function press(key, action) {
      if (navigator.vibrate) navigator.vibrate(8);
      if (action === 'clear') { expr = ''; showResult(0); expr = ''; }
      else if (action === 'back') expr = expr.slice(0, -1);
      else if (action === 'eq') return calculate();
      else expr += key;
      render();
    }

    document.querySelector('.keys').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) press(b.dataset.key, b.dataset.action);
    });

    document.addEventListener('keydown', (e) => {
      if (/^[0-9+\-*/%^().]$/.test(e.key)) press(e.key);
      else if (e.key === ',') press('.');
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); press(null, 'eq'); }
      else if (e.key === 'Backspace') press(null, 'back');
      else if (e.key === 'Escape') press(null, 'clear');
    });

    window.addEventListener('online', () => setOnline(true));
    window.addEventListener('offline', () => setOnline(false));

    // Установка как приложения. Работает на https или localhost.
    if ('serviceWorker' in navigator && window.isSecureContext) {
      navigator.serviceWorker.register('/sw.js').catch(() => {});
    }
  </script>
</body>
</html>
