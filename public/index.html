<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Калькулятор</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
           font-family: system-ui, sans-serif; background: #1e1f24; color: #eee; }
    .calc { width: 320px; background: #2b2d34; border-radius: 16px; padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    .display { background: #15161a; border-radius: 10px; padding: 12px; margin-bottom: 12px;
               text-align: right; min-height: 84px; }
    .expr { color: #999; min-height: 20px; word-break: break-all; }
    .result { font-size: 32px; word-break: break-all; }
    .error { color: #ff6b6b; font-size: 18px; }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    button { height: 56px; border: 0; border-radius: 10px; font-size: 20px; cursor: pointer;
             background: #3a3d46; color: #eee; }
    button:hover { filter: brightness(1.15); }
    button.op { background: #4b5563; }
    button.eq { background: #f59e0b; color: #111; grid-column: span 2; }
    button.clear { background: #b91c1c; }
  </style>
</head>
<body>
  <div class="calc">
    <div class="display">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>
    <div class="keys">
      <button class="clear" data-action="clear">C</button>
      <button class="op" data-action="back">⌫</button>
      <button class="op" data-key="(">(</button>
      <button class="op" data-key=")">)</button>
      <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
      <button class="op" data-key="/">÷</button>
      <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
      <button class="op" data-key="*">×</button>
      <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
      <button class="op" data-key="-">−</button>
      <button data-key="0">0</button><button data-key=".">.</button>
      <button class="op" data-key="%">%</button>
      <button class="op" data-key="+">+</button>
      <button class="op" data-key="^">xʸ</button>
      <button class="eq" data-action="eq">=</button>
      <button class="op" data-key="-">±</button>
    </div>
  </div>
  <script>
    const exprEl = document.getElementById('expr');
    const resultEl = document.getElementById('result');
    let expr = '';

    function render() { exprEl.textContent = expr; }

    async function calculate() {
      if (!expr) return;
      // Вычисление идёт через роут сервера GET /calc?expr=...
      const res = await fetch('/calc?expr=' + encodeURIComponent(expr));
      const data = await res.json();
      if (res.ok) {
        resultEl.className = 'result';
        resultEl.textContent = data.result;
        expr = String(data.result);
      } else {
        resultEl.className = 'result error';
        resultEl.textContent = data.error;
      }
      render();
    }

    function press(key, action) {
      if (action === 'clear') { expr = ''; resultEl.className = 'result'; resultEl.textContent = '0'; }
      else if (action === 'back') expr = expr.slice(0, -1);
      else if (action === 'eq') return calculate();
      else expr += key;
      render();
    }

    document.querySelector('.keys').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (b) press(b.dataset.key, b.dataset.action);
    });

    document.addEventListener('keydown', (e) => {
      if (/^[0-9+\-*/%^().]$/.test(e.key)) press(e.key);
      else if (e.key === ',') press('.');
      else if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); press(null, 'eq'); }
      else if (e.key === 'Backspace') press(null, 'back');
      else if (e.key === 'Escape') press(null, 'clear');
    });
  </script>
</body>
</html>
